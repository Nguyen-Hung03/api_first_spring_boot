spring.application.name=shop-api
server.port=8088

# MySQL (XAMPP mặc định chạy cổng 3307 trên máy này). Có thể override bằng biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/shop_api?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Jackson: ISO-8601 date-time, bỏ các field null khỏi JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Swagger UI: http://localhost:8088/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.urls[0].name=Shop API (contract shop-api.yaml)
springdoc.swagger-ui.urls[0].url=/shop-api.yaml
springdoc.swagger-ui.urls[1].name=Shop API (springdoc runtime)
springdoc.swagger-ui.urls[1].url=/v3/api-docs
springdoc.swagger-ui.urls-primary-name=Shop API (contract shop-api.yaml)

# Tạo dữ liệu mẫu khi DB trống
shop.seed-data=true
