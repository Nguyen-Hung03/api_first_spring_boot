<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm · Shop</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
    <h1><a href="/">Shop</a></h1>
    <nav>
        <a href="/customers">Khách hàng</a>
        <a href="/products">Sản phẩm</a>
        <a href="/orders">Đơn hàng</a>
    </nav>
    <div class="env">
        <label for="baseUrl">API:</label>
        <select id="baseUrl">
            <option value="http://localhost:8088/api/v1">Backend :8088</option>
            <option value="http://127.0.0.1:4010">Mock :4010</option>
        </select>
        <span id="envBadge" class="badge real">REAL API</span>
    </div>
</header>
<main>
    <div class="heading">
        <div>
            <p class="eyebrow">Sản phẩm</p>
            <h2>Danh sách sản phẩm</h2>
            <p class="lead">Lọc theo tên, danh mục hoặc sắp xếp theo giá.</p>
        </div>
        <a class="btn" href="/products/new">Thêm sản phẩm</a>
    </div>
    <div id="message" class="alert" hidden></div>
    <div id="summary" class="stats"></div>
    <form id="filter" class="toolbar">
        <input id="keyword" placeholder="Tìm tên sản phẩm">
        <input id="category" placeholder="Danh mục">
        <select id="sort">
            <option value="id,asc">Mới thêm trước</option>
            <option value="price,asc">Giá tăng dần</option>
            <option value="price,desc">Giá giảm dần</option>
            <option value="name,asc">Tên A-Z</option>
        </select>
        <button type="submit">Tìm</button>
    </form>
    <div class="table-wrap">
    <table>
        <thead><tr><th>ID</th><th>Tên</th><th>Danh mục</th><th class="num">Giá</th><th class="num">Tồn kho</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
    </table>
    </div>
    <div id="pager" class="pager"></div>
</main>
<script src="/common.js"></script>
<script src="/pages/products.js"></script>
</body>
</html>
